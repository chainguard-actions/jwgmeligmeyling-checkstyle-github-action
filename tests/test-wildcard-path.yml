name: Test wildcard path pattern for checkstyle reports
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create multiple Checkstyle XML reports
        run: |
          mkdir -p /tmp/checkstyle-multi
          cat > /tmp/checkstyle-multi/module-a-checkstyle.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <checkstyle version="8.40">
            <file name="/home/runner/work/myproject/module-a/src/Foo.java">
              <error line="5" column="1" severity="error" message="Missing a Javadoc comment." source="com.puppycrawl.tools.checkstyle.checks.javadoc.MissingJavadocMethodCheck"/>
            </file>
          </checkstyle>
          EOF
          cat > /tmp/checkstyle-multi/module-b-checkstyle.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <checkstyle version="8.40">
            <file name="/home/runner/work/myproject/module-b/src/Bar.java">
              <error line="3" column="1" severity="warning" message="Line is longer than 80 characters (found 90)." source="com.puppycrawl.tools.checkstyle.checks.sizes.LineLengthCheck"/>
            </file>
          </checkstyle>
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          path: /tmp/checkstyle-multi/**/*.xml
          name: Checkstyle Multi
          title: Checkstyle Multi-Module Report
          token: ${{ github.token }}

      - name: Assert action ran (succeeded or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with wildcard path"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
